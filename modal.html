<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Opener - Configurar Link</title>
    <style>
      :root {
        --bg: #22222a;
        --card: #2c2c36;
        --input-bg: #18181f;
        --border: #424254;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
        user-select: none;
      }

      header {
        margin-bottom: 16px;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }

      .token-badge {
        display: inline-block;
        font-size: 12px;
        color: var(--primary);
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        padding: 2px 8px;
        border-radius: 12px;
        margin-top: 4px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .form-group {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="url"] {
        width: 100%;
        background-color: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus,
      input[type="url"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
      }

      .hint {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .left-actions {
        display: flex;
        gap: 8px;
      }

      .right-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 500;
        border-radius: var(--radius);
        cursor: pointer;
        border: none;
        transition: background-color 0.2s, transform 0.1s;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }

      .btn-danger {
        background-color: transparent;
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.4);
      }

      .btn-danger:hover {
        background-color: rgba(239, 68, 68, 0.15);
      }
    </style>
  </head>
  <body>
    <div>
      <header>
        <div class="header-title">
          <span>🔗</span>
          <span id="title">Vincular Link ao Token</span>
        </div>
        <div id="tokenBadge" class="token-badge">Carregando token...</div>
      </header>

      <form id="linkForm" onsubmit="return false;">
        <div class="form-group">
          <label for="urlInput">URL do Link *</label>
          <input
            type="text"
            id="urlInput"
            placeholder="https://exemplo.com/ficha"
            required
            autofocus
            autocomplete="off"
            spellcheck="false"
          />
          <div class="hint">Cole o link da ficha de personagem, regras, anotações, etc.</div>
        </div>

        <div class="form-group">
          <label for="nameInput">Nome de Exibição (Opcional)</label>
          <input
            type="text"
            id="nameInput"
            placeholder="Ex: Ficha de D&D, Ameaça, Inventário"
            autocomplete="off"
          />
          <div class="hint">Texto que aparecerá no botão do menu de contexto.</div>
        </div>
      </form>
    </div>

    <div class="actions">
      <div class="left-actions">
        <button type="button" id="btnDelete" class="btn-danger" style="display: none;">
          Remover Link
        </button>
      </div>
      <div class="right-actions">
        <button type="button" id="btnCancel" class="btn-secondary">
          Cancelar
        </button>
        <button type="button" id="btnSave" class="btn-primary">
          Salvar
        </button>
      </div>
    </div>

    <script type="module" src="./src/modal.js"></script>
  </body>
</html>

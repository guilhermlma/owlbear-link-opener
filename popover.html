<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Opener</title>
    <style>
      :root {
        --bg: #1c1c22;
        --card-bg: #272732;
        --card-hover: #2f2f3d;
        --border: #3b3b4a;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --success: #10b981;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 16px;
        min-height: 100vh;
        user-select: none;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-icon {
        width: 24px;
        height: 24px;
      }

      .header-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 500;
        color: var(--success);
        background: rgba(16, 185, 129, 0.12);
        padding: 3px 8px;
        border-radius: 12px;
        border: 1px solid rgba(16, 185, 129, 0.25);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--success);
      }

      .info-box {
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.25);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.4;
        color: #d1d5db;
        margin-bottom: 16px;
      }

      .info-box strong {
        color: #ffffff;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
      }

      .links-count {
        font-size: 11px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 1px 6px;
        border-radius: 10px;
        color: var(--text);
      }

      .links-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 250px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .links-list::-webkit-scrollbar {
        width: 4px;
      }

      .links-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .link-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        transition: border-color 0.2s, background-color 0.2s;
      }

      .link-card:hover {
        border-color: var(--primary);
        background: var(--card-hover);
      }

      .link-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
      }

      .link-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .link-token {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .link-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .btn-open {
        background: var(--primary);
        color: #ffffff;
        text-decoration: none;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background-color 0.2s;
      }

      .btn-open:hover {
        background: var(--primary-hover);
      }

      .btn-edit {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s;
      }

      .btn-edit:hover {
        color: var(--text);
        border-color: var(--text-muted);
      }

      .empty-state {
        text-align: center;
        padding: 24px 12px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .empty-state-icon {
        font-size: 28px;
        margin-bottom: 6px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-brand">
        <img src="./icon.svg" alt="Logo" class="header-icon" />
        <span class="header-title">Link Opener</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Ativo</span>
      </div>
    </div>

    <div class="info-box">
      💡 <strong>Como usar:</strong> Clique com o botão direito em qualquer token no mapa para <strong>Adicionar</strong> ou <strong>Abrir</strong> um link direto da mesa!
    </div>

    <div class="section-header">
      <span class="section-title">Links na Mesa</span>
      <span id="linksCount" class="links-count">0</span>
    </div>

    <div id="linksList" class="links-list">
      <div class="empty-state">
        <div class="empty-state-icon">🔗</div>
        <div>Carregando tokens da cena...</div>
      </div>
    </div>

    <script type="module" src="./src/popover.js"></script>
  </body>
</html>
